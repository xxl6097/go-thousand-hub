<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>千机台 · Remote Console</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/style.css" />
<script>
  // 登录态判定前的"检查中"标记:先隐藏登录框与主界面,避免刷新时登录框闪现
  document.documentElement.classList.add("boot");
</script>
</head>
<body>

<!-- ===== 登录遮罩(默认显示,登录成功后隐藏) ===== -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">RC</div>
      <div>
        <div class="brand-name">千机台</div>
        <div class="brand-sub">Remote Console · 主机远控</div>
      </div>
    </div>
    <form id="loginForm" autocomplete="off">
      <label>管理员账号
        <input id="loginUser" name="username" autocomplete="username" required />
      </label>
      <label>密码
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
      </label>
      <div id="loginErr" class="login-err"></div>
      <button type="submit" class="btn primary">登 录</button>
    </form>
  </div>
</div>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="brand small">
    <div class="brand-mark">RC</div>
    <div class="brand-name">千机台</div>
    <div class="brand-sub" id="brandStats"></div>
  </div>
  <div class="top-right">
    <button id="btnReconnect" class="chip danger hidden" title="控制通道已断开,点击重连">通道断开</button>
    <div id="userMenu" class="user-menu">
      <button id="userMenuBtn" class="user-btn" title="菜单">
        <span id="whoAmI" class="who"></span><span class="caret">▾</span>
      </button>
      <div id="userMenuPanel" class="menu-panel hidden">
        <button id="mCheckUpd" class="menu-item" title="检测服务端是否有可升级的新版本">⟳ 检测升级</button>
        <button id="mUpgrade" class="menu-item up hidden" title="升级到检测到的新版本"></button>
        <div class="menu-sep"></div>
        <button id="mLogout" class="menu-item danger">退出登录</button>
      </div>
    </div>
  </div>
</header>

<!-- ===== 主体 ===== -->
<main id="main" class="layout hidden">
  <!-- 主机侧栏 -->
  <aside class="sidebar">
    <div class="side-search">
      <input id="filterText" type="search" placeholder="搜索主机名 / IP / 系统 …" />
      <div class="filters">
        <button data-f="all" class="chip active">全部</button>
        <button data-f="online" class="chip">在线</button>
        <button data-f="offline" class="chip">离线</button>
      </div>
    </div>
    <div id="agentList" class="agent-list"></div>
    <div id="agentEmpty" class="empty hidden">
      <div class="empty-ico">▤</div>
      <div>暂无匹配主机</div>
      <div class="dim">安装 rc-agent 的主机会出现在这里</div>
    </div>
  </aside>

  <!-- 终端工作区 -->
  <section class="workspace">
    <div id="tabbar" class="tabbar">
      <button id="backToHosts" class="back-btn" title="返回主机列表">‹</button>
      <div class="tab-placeholder">点击左侧主机开始远程会话</div>
    </div>
    <div id="termHost" class="term-host"></div>
    <!-- 手机端控制台专属键盘 -->
    <div id="consoleKeys" class="ck hidden"></div>
  </section>
</main>

<button id="ckFloat" class="ck-float hidden" title="打开控制台键盘">⌨</button>

<!-- ===== 手机端底部导航 ===== -->
<nav id="mobileNav" class="mnav hidden">
  <button id="mNavHosts" class="mnav-btn active"><span class="mnav-ico">▤</span>主机</button>
  <button id="mNavTerm" class="mnav-btn"><span class="mnav-ico">⌨</span>终端<span id="mNavTermCnt" class="mnav-cnt hidden"></span></button>
</nav>

<div id="toastWrap"></div>

<!-- ===== 操作/确认弹层 ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">操作</div>
    <div class="modal-body" id="modalBody"></div>
    <input id="modalInput" class="modal-input hidden" placeholder="输入主机名以确认操作" autocomplete="off" />
    <div class="modal-foot">
      <button id="modalCancel" class="btn ghost">取消</button>
      <button id="modalOk" class="btn primary" disabled>确认</button>
    </div>
  </div>
</div>


<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
